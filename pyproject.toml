[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dobot-controller"
version = "0.1.0"
description = "Controlador modular en Python para Dobot Magician en Ubuntu / Linux"
readme = "README.md"
authors = [{ name = "Leandro Panesso" }]
requires-python = ">=3.9"
dependencies = [
    "pydobotplus>=0.1.2",
    "pyserial>=3.4",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
dobot = "dobot_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
